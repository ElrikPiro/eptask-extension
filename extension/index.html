<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestor de tareas · ElrikPiro</title>
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">ElrikPiro</p>
          <h1>Gestor de tareas</h1>
          <p>Planificación, ejecución y seguimiento.</p>
        </div>
        <div class="hero-tools">
          <span id="connection-badge" class="status-pill offline">Desconectado</span>
          <button id="open-options" type="button" class="secondary">Configuración</button>
          <button type="button" data-action="refresh" class="secondary">Actualizar datos</button>
        </div>
      </header>

      <p id="app-message" class="alert info" role="status" aria-live="polite" hidden></p>

      <nav class="panel nav-bar" aria-label="Vistas del gestor">
        <div class="button-row">
          <button type="button" data-view="tasks">Tareas</button>
          <button type="button" class="secondary" data-view="agenda">Agenda</button>
          <button type="button" class="secondary" data-view="stats">Estadísticas</button>
          <button type="button" class="secondary" data-view="events">Eventos</button>
          <button type="button" class="secondary" data-view="projects">Proyectos</button>
          <button type="button" class="secondary" data-view="detail">Detalle</button>
        </div>
      </nav>

      <main id="main-view" class="layout-grid" aria-live="polite">
        <section class="panel"><p class="empty">Cargando gestor…</p></section>
      </main>

      <section class="panel notification-panel">
        <div class="panel-header">
          <div>
            <h2>Historial de notificaciones</h2>
            <p class="caption">Copia local de las notificaciones recibidas por el monitor. El borrado local todavía no está disponible.</p>
          </div>
          <button id="clear-history" type="button" class="secondary" disabled>Vaciar copia local</button>
        </div>
        <ul id="notification-list" class="notification-list"><li class="empty">Sin notificaciones guardadas.</li></ul>
      </section>
    </div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
