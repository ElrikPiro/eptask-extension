<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ElrikPiro</title>
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body class="popup-page">
    <main class="popup-shell" aria-labelledby="popup-title">
      <header class="popup-header">
        <div>
          <p class="eyebrow">ElrikPiro</p>
          <h1 id="popup-title">Tarea prioritaria</h1>
        </div>
        <div class="popup-header-actions">
          <span id="popup-error-badge" class="popup-error-badge" role="img" tabindex="0" hidden>!</span>
          <button id="open-options" class="icon-button" type="button" aria-label="Abrir configuración" title="Configuración">⚙</button>
        </div>
      </header>
      <p id="popup-status" class="status-line" role="status" aria-live="polite">Cargando estado…</p>
      <section id="urgent-task" class="urgent-card" aria-live="polite" aria-label="Tarea más urgente">
        <p class="empty">Cargando tarea…</p>
      </section>
      <div class="popup-task-actions" role="group" aria-label="Acciones de la tarea prioritaria">
        <button id="complete-task" type="button" disabled>Completar</button>
        <button id="snooze-task" type="button" class="secondary" disabled>Posponer 5 minutos</button>
      </div>
      <div class="popup-actions">
        <button id="refresh-agenda" type="button" class="secondary" disabled>Actualizar</button>
        <button id="open-manager" type="button" aria-describedby="manager-open-status">Abrir gestor</button>
      </div>
      <p id="manager-open-status" class="status-line manager-open-status" role="status" aria-live="polite" hidden></p>
      <section class="popup-notifications" aria-labelledby="popup-notifications-title">
        <div class="panel-header">
          <h2 id="popup-notifications-title">Avisos guardados</h2>
          <button id="popup-clear-history" class="secondary" type="button" disabled>Vaciar</button>
        </div>
        <p id="popup-notification-monitor-status" class="status-line offline-text" role="status" aria-live="polite">Cargando estado de recepción…</p>
        <div id="popup-notification-continuity" class="notification-continuity" aria-live="polite" hidden></div>
        <ul id="popup-notification-list" class="notification-list"><li class="empty">Sin notificaciones guardadas.</li></ul>
      </section>
    </main>
    <script type="module" src="js/popup.js"></script>
  </body>
</html>
